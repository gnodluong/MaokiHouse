name: Deploy Maoki API (Supabase Edge Function)

# Deploys supabase/functions/api (inbound webhooks, messaging, reviews, YouTube, calendar channels, worker).
# Needs repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Optional repository variable SUPABASE_PROJECT_REF (defaults to the project in shared/supabase-public.json).
# Function secrets (WORKER_SECRET) are set once in Supabase, see docs/MESSAGING.md.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/edge-function.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno run -A --config supabase/functions/api/deno.json supabase/functions/api/smoke.test.ts
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'msucrkkxuplgijxanzxu' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN is not set; skipping deploy."; exit 0; fi
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
