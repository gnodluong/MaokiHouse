name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis --x64
          - os: macos-latest
            args: --mac dmg --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run desktop:renderer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned build; add signing certificates to sign
      - uses: actions/upload-artifact@v4
        with:
          name: maoki-admin-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
